<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClickFast — Le jeu du clicker le plus rapide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>ClickFast</h1>
    <p class="subtitle">Sois le clicker le plus rapide de France !</p>
    <section class="game">
      <div class="stats">
        <div class="stat"><span class="label">Temps restant</span><span id="timer" class="value">5.0s</span></div>
        <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
      </div>
      <div class="username-field">
        <label for="username">Ton pseudo</label>
        <input type="text" id="username" maxlength="20" placeholder="ex: SpeedyGonzales" value="Joueur">
      </div>
      <button id="click-button" class="click-btn" disabled>Prêt ?</button>
      <button id="start-button" class="start-btn">Démarrer la partie</button>
    </section>
    <section class="leaderboard">
      <h2>Classement</h2>
      <ol id="leaderboard-list"><li class="empty">Aucun score pour le moment</li></ol>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
